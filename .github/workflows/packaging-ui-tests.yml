name: Packaging UI regression tests

on:
  pull_request:
    paths:
      - "opensv_train/packaging.py"
      - "opensv_train/sfpk.py"
      - "opensv_train/__main__.py"
      - "trainsv_gui.py"
      - "tests/test_packaging.py"
      - "tests/test_sfpk_packaging.py"
      - "tests/test_gui_packaging_ui.py"
      - ".github/workflows/packaging-ui-tests.yml"
  push:
    branches:
      - main

jobs:
  packaging-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run SVPK and WebUI regression tests
        run: python -m pytest -q tests/test_packaging.py tests/test_sfpk_packaging.py tests/test_gui_packaging_ui.py
