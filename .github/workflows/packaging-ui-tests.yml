name: Packaging UI regression tests

on:
  pull_request:
    paths:
      - "opensv_train/packaging.py"
      - "opensv_train/sfpk.py"
      - "opensv_train/__main__.py"
      - "opensv_train/data.py"
      - "opensv_train/audio_io.py"
      - "opensv_train/f0.py"
      - "opensv_train/f0_tracking.py"
      - "opensv_train/filename_labels.py"
      - "opensv_train/phoneme_maps_sv1112.py"
      - "opensv_train/train.py"
      - "opensv_train/voice.py"
      - "trainsv_gui.py"
      - "README.md"
      - "README.zh-CN.md"
      - "tests/test_data.py"
      - "tests/test_gui_performance.py"
      - "tests/test_audio_io.py"
      - "tests/test_pitch.py"
      - "tests/test_packaging.py"
      - "tests/test_sfpk_packaging.py"
      - "tests/test_gui_packaging_ui.py"
      - "tests/test_f0_profile.py"
      - "tests/test_f0_tracking.py"
      - "tests/test_filename_labels.py"
      - "tests/test_phoneme_maps_sv1112.py"
      - ".github/workflows/packaging-ui-tests.yml"
  push:
    branches:
      - main

jobs:
  packaging-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install pytest cryptography numpy soundfile scipy
      - name: Check Python syntax
        run: python -m compileall -q opensv_train tests
      - name: Run packaging, Pitch/F0 and WebUI regression tests
        run: |
          python -m pytest -q tests/test_packaging.py tests/test_sfpk_packaging.py tests/test_gui_packaging_ui.py tests/test_f0_profile.py
          python -m pytest -q tests/test_filename_labels.py -k "not f0_at"
          python -m pytest -q tests/test_phoneme_maps_sv1112.py
          python -m pytest -q tests/test_audio_io.py tests/test_f0_tracking.py
          python -m pytest -q tests/test_gui_performance.py
