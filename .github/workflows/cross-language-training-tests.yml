name: Joint multilingual and cross-language training tests

on:
  pull_request:
    paths:
      - "opensv_train/train.py"
      - "opensv_train/acoustic.py"
      - "opensv_train/data.py"
      - "opensv_train/__main__.py"
      - "tests/test_cross_language_training.py"
      - "tests/test_multilingual_training.py"
      - ".github/workflows/cross-language-training-tests.yml"

jobs:
  cross-language-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy scipy soundfile praat-parselmouth cryptography
      - name: Run cross-language preservation and joint multilingual tests
        run: python -m pytest -q tests/test_cross_language_training.py tests/test_multilingual_training.py
